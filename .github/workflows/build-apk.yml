name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Download source
        run: |
          curl -sL "https://muse.ai/files/1304034992798645/28461032813505981/xikao6robjt4ipl2vry4520o/kotlin-port.tar.gz" -o source.tar.gz
          tar -xzf source.tar.gz
          # Adjust paths as needed
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          
      - name: Build APK
        run: |
          cd kotlin-port
          gradle assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: kotlin-port/app/build/outputs/apk/debug/app-debug.apk
