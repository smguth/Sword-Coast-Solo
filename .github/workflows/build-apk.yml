name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract project
        run: |
          curl -sL "https://muse.ai/files/1304034992798645/29791252533808093/2oplcf27hiufw4r5i5p3iac7/kotlin-port.tar.gz" -o kotlin-port.tar.gz
          tar -xzf kotlin-port.tar.gz
          shopt -s dotglob
          mv kotlin-port/* . 2>/dev/null || true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
       uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
